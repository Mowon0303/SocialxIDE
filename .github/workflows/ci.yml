name: CI

# Runs the full verification suite on every push to main and every PR.
# No release or publish happens here — releases are gated separately in
# release.yml behind a manual trigger and human approval.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # Highest-fidelity check: launches the real Electron app via Playwright and
  # drives editor/run/terminal/git/snapshot/problems flows end to end. Heavier
  # and more timing-sensitive than `verify`, so it runs as its own job (with CI
  # retries) rather than gating the fast checks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies (clang++ for C++ run, xvfb for the display)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Electron/Chromium shared libraries
        run: npx playwright install-deps

      - name: Rebuild node-pty against Electron (real terminal)
        run: npm run desktop:rebuild

      - name: Desktop E2E (Playwright + Electron under xvfb)
        # 24-bit depth + a real screen size: the xvfb-run default is 8-bit,
        # which makes Electron/Chromium render elements that never become
        # "visible/stable" for Playwright.
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run desktop:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: 1

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
