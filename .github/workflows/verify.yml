name: Verify

# Reusable verification job: production build, unit tests, backend boundary +
# release-evidence checks, and the live language-server integration test
# (Pyright is bundled; clangd is installed below). Called by ci.yml on every
# push/PR and by release.yml behind the manual approval gate.
#
# The desktop Playwright E2E is intentionally NOT run here: it needs a virtual
# display, an Electron rebuild of node-pty, and is run locally. Add it as a
# separate job later if you want it gated in CI.

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install clangd (live C++ language-server checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd
          which clangd && clangd --version

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Backend boundary + release-evidence checks
        run: npm run desktop:test:backend

      - name: Live language-server checks (Pyright + clangd)
        run: npm run desktop:test:lsp-live
